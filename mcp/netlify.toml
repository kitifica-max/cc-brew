[build]
  command = "npm install"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["lib/**"]

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp-rpc"
  status = 200

[[redirects]]
  from = "/api/sessions"
  to = "/.netlify/functions/sessions"
  status = 200

[[redirects]]
  from = "/api/sessions/*"
  to = "/.netlify/functions/sessions"
  status = 200

[[redirects]]
  from = "/api/ai/process"
  to = "/.netlify/functions/ai-process"
  status = 200

[[redirects]]
  from = "/api/account"
  to = "/.netlify/functions/account"
  status = 200
