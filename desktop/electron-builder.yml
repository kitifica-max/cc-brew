appId: com.cccontroller.app
productName: CC Controller
copyright: Copyright © 2026
electronVersion: "30.5.1"

directories:
  output: dist
  buildResources: assets

files:
  - src/**/*
  - assets/tray-icon.png
  - package.json
  - node_modules/**/*

mac:
  category: public.app-category.developer-tools
  icon: assets/tray-icon.png
  # Firma y notarización: pon `notarize: true` cuando tengas un certificado
  # "Developer ID Application" y las variables APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID. Sin ellas el DMG sale sin
  # firmar y macOS lo bloquea (ver "DMG sin firmar" en el README).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64

dmg:
  title: CC Controller
  window:
    width: 540
    height: 380
