appId: com.cccontroller.app
productName: CC Controller
copyright: Copyright © 2026
electronVersion: "30.5.1"

directories:
  output: dist
  buildResources: assets

files:
  - src/**/*
  - assets/tray-icon.png
  - package.json
  - node_modules/**/*

mac:
  category: public.app-category.developer-tools
  icon: assets/tray-icon.png
  # Firma ad-hoc: en Apple Silicon un binario sin ninguna firma no arranca
  # ("la app está dañada"). Esto no es notarización; el usuario sigue teniendo
  # que abrirla con clic derecho la primera vez (ver "DMG sin firmar" en el README).
  # Con un certificado "Developer ID Application" quita esta línea y pon
  # `notarize: true` junto a APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID.
  identity: "-"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64

dmg:
  title: CC Controller
  window:
    width: 540
    height: 380
