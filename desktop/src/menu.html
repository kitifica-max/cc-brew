<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 268px;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  font-size: 13px;
  color: #fff;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-app-region: no-drag;
}
.wrap {
  background: rgba(22,22,24,0.94);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  overflow: hidden;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  -webkit-app-region: drag;
}
.logo {
  width: 22px; height: 22px;
  background: #f04e23;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800; color: #fff;
  flex-shrink: 0; letter-spacing: -0.5px;
}
.title {
  font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,0.8);
  flex: 1;
}
.btn-close {
  width: 22px; height: 22px;
  background: rgba(255,255,255,0.07);
  border: none; border-radius: 6px;
  color: rgba(255,255,255,0.45);
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-app-region: no-drag;
  transition: background 0.12s, color 0.12s;
}
.btn-close:hover { background: rgba(255,255,255,0.13); color: #fff; }

/* ── Info block ── */
.info {
  padding: 8px 12px 9px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex; flex-direction: column; gap: 3px;
}
.info-row {
  display: flex; align-items: center; gap: 6px;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.status-dot.on  { background: #22c55e; box-shadow: 0 0 4px rgba(34,197,94,0.6); }
.status-dot.off { background: rgba(255,255,255,0.2); }
.info-label { font-size: 10.5px; color: rgba(255,255,255,0.35); min-width: 50px; }
.info-val   { font-size: 10.5px; color: rgba(255,255,255,0.75); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info-path  { font-size: 9.5px; color: rgba(255,255,255,0.25); padding-left: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Menu items ── */
.section { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
.section:last-child { border-bottom: none; }
.item {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 12px;
  cursor: pointer;
  color: rgba(255,255,255,0.82);
  transition: background 0.1s;
  -webkit-app-region: no-drag;
}
.item:hover { background: rgba(255,255,255,0.07); }
.item.red   { color: rgba(255,100,100,0.8); }
.item.red:hover { background: rgba(239,68,68,0.13); color: #fca5a5; }
.item svg { flex-shrink: 0; opacity: 0.55; transition: opacity 0.1s; }
.item:hover svg { opacity: 1; }
.item-label { flex: 1; font-size: 12.5px; }
.update-chip {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em;
  background: rgba(240,78,35,0.18); color: #f04e23;
  padding: 2px 6px; border-radius: 4px;
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="logo">CC</div>
    <span class="title">CC Creator</span>
    <button class="btn-close" id="btn-close">
      <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l10 10M11 1L1 11"/></svg>
    </button>
  </div>

  <!-- Info -->
  <div class="info" id="info"></div>

  <!-- Running-only actions -->
  <div class="section" id="sec-running" style="display:none">
    <div class="item" id="item-pwa">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      <span class="item-label">Abrir App Directa</span>
    </div>
    <div class="item" id="item-folder">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
      <span class="item-label">Abrir carpeta existente</span>
    </div>
  </div>

  <!-- Session -->
  <div class="section">
    <div class="item" id="item-start" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      <span class="item-label">Iniciar sesión</span>
    </div>
    <div class="item" id="item-stop" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <span class="item-label">Detener</span>
    </div>
    <div class="item" id="item-restart" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      <span class="item-label">Reiniciar</span>
    </div>
    <div class="item red" id="item-signout">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="item-label">Cerrar sesión</span>
    </div>
  </div>

  <!-- Settings -->
  <div class="section">
    <div class="item" id="item-updates">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span class="item-label" id="updates-label">Buscar actualizaciones</span>
      <span class="update-chip" id="updates-chip" style="display:none">Nueva</span>
    </div>
    <div class="item" id="item-token">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <span class="item-label">Copiar SESSION_TOKEN</span>
    </div>
    <div class="item red" id="item-quit">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      <span class="item-label">Salir de CC Creator</span>
    </div>
  </div>

</div>
<script>
let state = { status: 'stopped', project: null, uptime: null, updateAvailable: null };

function renderInfo() {
  const { status, project, uptime } = state;
  const running = status === 'running';
  let html = `<div class="info-row">
    <div class="status-dot ${running ? 'on' : 'off'}"></div>
    <span class="info-label">Estado</span>
    <span class="info-val">${running ? 'Ejecutando' : 'Detenido'}</span>
  </div>`;
  if (uptime) html += `<div class="info-row">
    <span style="width:6px;flex-shrink:0"></span>
    <span class="info-label">Uptime</span>
    <span class="info-val">${uptime}</span>
  </div>`;
  if (project) {
    html += `<div class="info-row">
      <span style="width:6px;flex-shrink:0"></span>
      <span class="info-label">Proyecto</span>
      <span class="info-val">${project.name}</span>
    </div>`;
    if (project.path) html += `<div class="info-path">${project.path}</div>`;
  }
  document.getElementById('info').innerHTML = html;
}

function render() {
  const { status, updateAvailable } = state;
  const running = status === 'running';
  document.getElementById('sec-running').style.display  = running ? '' : 'none';
  document.getElementById('item-start').style.display   = running ? 'none' : 'flex';
  document.getElementById('item-stop').style.display    = running ? 'flex' : 'none';
  document.getElementById('item-restart').style.display = running ? 'flex' : 'none';
  const lbl = document.getElementById('updates-label');
  const chip = document.getElementById('updates-chip');
  if (updateAvailable) {
    lbl.textContent = `Actualizar — v${updateAvailable.version} disponible`;
    chip.style.display = '';
  } else {
    lbl.textContent = 'Buscar actualizaciones';
    chip.style.display = 'none';
  }
  renderInfo();
}

document.getElementById('btn-close').addEventListener('click',   () => cmenu.close());
document.getElementById('item-pwa').addEventListener('click',    () => cmenu.openPwa());
document.getElementById('item-folder').addEventListener('click', () => cmenu.openFolder());
document.getElementById('item-start').addEventListener('click',  () => cmenu.start());
document.getElementById('item-stop').addEventListener('click',   () => cmenu.stop());
document.getElementById('item-restart').addEventListener('click',() => cmenu.restart());
document.getElementById('item-signout').addEventListener('click',() => cmenu.signOut());
document.getElementById('item-updates').addEventListener('click',() => {
  state.updateAvailable ? cmenu.brewUpdate() : cmenu.checkUpdates();
});
document.getElementById('item-token').addEventListener('click',  () => cmenu.copyToken());
document.getElementById('item-quit').addEventListener('click',   () => cmenu.quit());

cmenu.onState(s => { state = s; render(); });
render();
</script>
</body>
</html>
