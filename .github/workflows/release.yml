name: Release

# El DMG solo puede construirse en macOS, así que el binario sale de aquí:
# empuja un tag `vX.Y.Z` y este job publica el release con los dos DMG.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (vX.Y.Z)'
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias
        working-directory: desktop
        run: npm ci

      - name: Tests
        working-directory: desktop
        run: npm test

      # Un arch por invocación: en paralelo los dos DMG montan el mismo
      # /Volumes/CC Controller y el `hdiutil detach` de uno tumba al otro.
      - name: Construir DMG arm64
        working-directory: desktop
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Construir DMG x64
        working-directory: desktop
        run: |
          hdiutil detach '/Volumes/CC Controller' 2>/dev/null || true
          npx electron-builder --mac dmg --x64 --publish never

      # Un .app sin firma real arranca como "la app está dañada" en Apple
      # Silicon, y eso solo se ve al instalar: mejor romper el release aquí.
      # `linker-signed` es la firma que deja el compilador y no cuenta: se
      # invalida en cuanto electron-builder toca el bundle.
      - name: Verificar firma ad-hoc
        working-directory: desktop
        run: |
          for app in 'dist/mac-arm64/CC Controller.app' 'dist/mac/CC Controller.app'; do
            codesign -dv --verbose=2 "$app" 2>&1 | tee /tmp/sig.txt
            grep -q 'Signature=adhoc' /tmp/sig.txt
            if grep -q 'linker-signed' /tmp/sig.txt; then
              echo "::error::$app solo tiene la firma del linker"
              exit 1
            fi
            codesign --verify --strict "$app"
          done

      - uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: CC Controller ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: desktop/dist/*.dmg

      - name: Actualizar Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"

          SHA_ARM64=$(shasum -a 256 "desktop/dist/CC.Controller-${VERSION}-arm64.dmg" | awk '{print $1}')
          SHA_INTEL=$(shasum -a 256 "desktop/dist/CC.Controller-${VERSION}.dmg" | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/kitifica-max/homebrew-tap.git" /tmp/tap
          python3 scripts/update-cask.py "$VERSION" "$SHA_ARM64" "$SHA_INTEL" /tmp/tap/Casks/cc-controller.rb

          cd /tmp/tap
          git config user.email "ci@kitifica.com"
          git config user.name "CC Controller CI"
          git add Casks/cc-controller.rb
          git commit -m "chore: bump cc-controller to v${VERSION}"
          git push
