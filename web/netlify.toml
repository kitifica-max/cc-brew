[build]
  base    = "web"
  command = "cd ../mcp && npm ci && cd ../web && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SESSION_ID,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_VAPID_PUBLIC_KEY,GEMINI_API_KEY,GITHUB_TOKEN,GITHUB_UPDATE_TOKEN,NEXT_PUBLIC_MCP_SERVER_URL,RESEND_API_KEY,SUPABASE_AUTH_HOOK_SECRET,SUPABASE_SERVICE_ROLE_KEY,WOMPI_API_SECRET,WOMPI_APP_ID"
  SECRETS_SCAN_OMIT_PATHS = "desktop/src/supabase-config.js,web/.env.local.example,.env.example,desktop/.env.example"

[functions]
  directory = "../mcp/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["../mcp/lib/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Dominio anterior -> nuevo dominio (CC Brew). ccc.kitifica.com queda como alias/redirect.
[[redirects]]
  from = "https://ccc.kitifica.com/*"
  to = "https://ccbrew.kitifica.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
